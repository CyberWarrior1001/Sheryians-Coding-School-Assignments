<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <nav>
            <div class="logo"><i class="ri-remix-fill"></i>ScaleX</div>
            <div class="navlinks">
                <ul>
                    <li>Home</li>
                    <li>About Us</li>
                    <li>Blogs</li>
                    <li>Contact Us</li>
                </ul>
            </div>
            <div class="button">
                <button>Get Started</button>
                <i class="ri-menu-line"></i>
            </div>
        </nav>
        <section>
            <div class="header"><h1>Insights & Blogs</h1></div>
            <div class="cards-section">
                <div class="capsules">
                    <span>All</span>
                    <span>Tech</span>
                    <span>SaaS</span>
                    <span>Marketing</span>
                </div>
                <div class="cards">
                    <div class="card">
                        <div class="image"><img src="/images/tech-card-image.jpg" alt=""></div>
                        <div class="card-footer">
                            <span>Tech</span>
                            <h1>Lorem ipsum dolor sit.</h1>
                            <span>May 23, 2025</span>
                        </div>
                    </div>


                    <div class="card">
                        <div class="image"><img src="/images/saas-card-image.jpg" alt=""></div>
                        <div class="card-footer">
                            <span>SaaS</span>
                            <h1>Lorem ipsum dolor sit.</h1>
                            <span>May 23, 2025</span>
                        </div>
                    </div>

                     <div class="card">
                        <div class="image"><img src="/images/marketing-card-image.jpg" alt=""></div>
                        <div class="card-footer">
                            <span>Marketing</span>
                            <h1>Lorem ipsum dolor sit.</h1>
                            <span>May 23, 2025</span>
                        </div>
                    </div>

                    
                </div>
            </div>
        </section>
    </main>
</body>

</html>
