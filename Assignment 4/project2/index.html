<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="portfolio-container">
        <aside class="left-section">
            <nav class="sidebar-nav">
                <span>About Me</span>
                <span>Clients</span>
                <span>Portfolio</span>
                <span>Contact</span>
            </nav>
            <div class="outer-folder-card">
                <div class="folder-card">
                    <div class="avatar">
                        <div class="inner-border">
                            <div class="inner-pink-circle">

                            </div>
                        </div>
                        <img src="./images/profile-image.png" alt="">
                    </div>
                    <div class="details">
                        <h1>I'm, <br>Awais Ahmad</h1>
                        <p class="mail">inquiry@awaisahmad.design <i class="ri-mail-line"></i></p>
                    </div>
                </div>
                <span class="about"> <i class="ri-atom-line"></i> About Me</span>
            </div>

        </aside>

        <main class="right-section">
            <header class="main-title">
                <h1>Portfolio</h1>
            </header>
            <div class="bento-grid">
                <div class="grid-card wide-card purple-bg">
                    <img src="https://thumbs.dreamstime.com/b/weathered-toy-ducks-floating-purple-water-vietnam-two-old-strangely-colored-showing-signs-wear-tear-448518433.jpg"
                        alt="">
                    <i class="ri-play-fill"></i>
                </div>
                <div class="grid-card dark-bg">
                    <div class="top">
                        <h3>251</h3>
                        <p>Projects</p>
                    </div>
                    <div class="bottom">
                        <h3>156</h3>
                        <p>Awards</p>
                    </div>
                </div>
                <div class="grid-card orange-bg">
                    <i class="ri-apple-fill"></i>
                    <p>CLIENTS</p>
                </div>
                <div class="grid-card wide-card gray-bg">
                    <div class="left"></div>
                    <div class="right">
                        <h1>172</h1>
                        <p>Global Design Awards.</p>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>

</html>
